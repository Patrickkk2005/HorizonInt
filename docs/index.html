<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HorizonInt — Romania Geopolitical Intelligence</title>
  <meta name="description" content="Romania-focused geopolitical intelligence dashboard tracking neighbors, NATO/EU, energy security, and domestic developments." />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet.heat -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <!-- marked.js (markdown rendering) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- html2canvas (map capture) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- jsPDF (PDF generation) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <!-- ── Header ───────────────────────────────────────────────────────────── -->
  <header id="header">
    <div class="header-left">
      <span class="logo">HORIZONINT</span>
      <span class="live-dot" title="Live feed"></span>
      <span class="live-label">LIVE</span>
    </div>
    <div class="header-center">
      <span id="utc-clock" class="utc-clock">--:--:-- UTC</span>
    </div>
    <div class="header-right">
      <button id="btn-export" class="export-btn" title="Download intelligence report as PDF">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span class="export-btn-label">EXPORT PDF</span>
      </button>
      <span class="stat-chip" id="stat-articles">
        <span class="stat-num" id="article-count">–</span>
        <span class="stat-label">articles</span>
      </span>
      <span class="stat-chip" id="stat-events">
        <span class="stat-num" id="event-count">–</span>
        <span class="stat-label">events</span>
      </span>
      <span class="stat-chip updated-chip">
        Updated <span id="last-updated">–</span>
      </span>
    </div>
  </header>

  <!-- ── Neighbor Hero Strip ─────────────────────────────────────────────── -->
  <div id="neighbor-strip">
    <span class="neighbor-label">NEIGHBOR WATCH</span>
    <div id="neighbor-chips">
      <button class="neighbor-chip" data-neighbor="ua" title="Ukraine">
        <span class="neighbor-flag">UA</span>
        <span class="neighbor-name">Ukraine</span>
        <span class="neighbor-count" id="nc-ua">–</span>
      </button>
      <button class="neighbor-chip" data-neighbor="md" title="Moldova">
        <span class="neighbor-flag">MD</span>
        <span class="neighbor-name">Moldova</span>
        <span class="neighbor-count" id="nc-md">–</span>
      </button>
      <button class="neighbor-chip" data-neighbor="hu" title="Hungary">
        <span class="neighbor-flag">HU</span>
        <span class="neighbor-name">Hungary</span>
        <span class="neighbor-count" id="nc-hu">–</span>
      </button>
      <button class="neighbor-chip" data-neighbor="rs" title="Serbia">
        <span class="neighbor-flag">RS</span>
        <span class="neighbor-name">Serbia</span>
        <span class="neighbor-count" id="nc-rs">–</span>
      </button>
      <button class="neighbor-chip" data-neighbor="bg" title="Bulgaria">
        <span class="neighbor-flag">BG</span>
        <span class="neighbor-name">Bulgaria</span>
        <span class="neighbor-count" id="nc-bg">–</span>
      </button>
      <button class="neighbor-chip neighbor-chip--nato" data-neighbor="nato" title="NATO">
        <span class="neighbor-flag">NATO</span>
        <span class="neighbor-count" id="nc-nato">–</span>
      </button>
      <button class="neighbor-chip neighbor-chip--energy" data-neighbor="energy" title="Energy">
        <span class="neighbor-flag">⚡</span>
        <span class="neighbor-name">Energy</span>
        <span class="neighbor-count" id="nc-energy">–</span>
      </button>
    </div>
    <div id="ro-impact-bar">
      <span class="ro-impact-chip ro-direct">DIRECT <span id="ri-count-direct">–</span></span>
      <span class="ro-impact-chip ro-security">SECURITY <span id="ri-count-security">–</span></span>
      <span class="ro-impact-chip ro-economic">ECONOMIC <span id="ri-count-economic">–</span></span>
    </div>
  </div>

  <!-- ── Category Filter Bar ──────────────────────────────────────────────── -->
  <div id="filter-bar">
    <button class="cat-btn active" data-cat="all">All</button>
    <button class="cat-btn" data-cat="conflict"    style="--cat-color:#ef4444">Conflict</button>
    <button class="cat-btn" data-cat="protests"    style="--cat-color:#f97316">Protests</button>
    <button class="cat-btn" data-cat="diplomacy"   style="--cat-color:#3b82f6">Diplomacy</button>
    <button class="cat-btn" data-cat="sanctions"   style="--cat-color:#a855f7">Sanctions</button>
    <button class="cat-btn" data-cat="humanrights" style="--cat-color:#ec4899">Human Rights</button>
    <button class="cat-btn" data-cat="elections"   style="--cat-color:#22c55e">Elections</button>
    <button class="cat-btn" data-cat="economy"     style="--cat-color:#84cc16">Economy</button>
    <button class="cat-btn" data-cat="environment" style="--cat-color:#14b8a6">Environment</button>
    <button class="cat-btn" data-cat="technology"  style="--cat-color:#06b6d4">Technology</button>
    <button class="cat-btn" data-cat="disaster"    style="--cat-color:#f59e0b">Disaster</button>
  </div>

  <!-- ── Main Grid ────────────────────────────────────────────────────────── -->
  <main id="main-grid">

    <!-- Left: Romania Impact Feed -->
    <section id="panel-ro-feed">
      <div class="panel-header">
        <span class="panel-title">Romania Impact</span>
        <span id="ro-feed-count" class="panel-subtitle">Loading…</span>
      </div>
      <div id="ro-feed-list" class="feed-list">
        <!-- RO-relevant articles, populated by app.js -->
      </div>
      <div class="panel-divider">
        <span class="panel-divider-label">World Feed</span>
      </div>
      <div id="world-feed-list" class="feed-list feed-list--secondary">
        <!-- Non-RO articles, populated by app.js -->
      </div>
    </section>

    <!-- Center: AI Briefing -->
    <aside id="panel-briefing">
      <div class="panel-header">
        <span class="panel-title">AI Intelligence Briefing</span>
        <span id="briefing-date" class="panel-subtitle">–</span>
      </div>
      <div id="briefing-content" class="briefing-body">
        <div class="skeleton-block"></div>
        <div class="skeleton-block" style="width:80%"></div>
        <div class="skeleton-block" style="width:90%"></div>
      </div>
      <div id="briefing-meta" class="briefing-meta"></div>
    </aside>

    <!-- Right: Event Timeline -->
    <section id="panel-timeline">
      <div class="panel-header">
        <span class="panel-title">Event Timeline</span>
        <span class="panel-subtitle">Geo-tagged events</span>
      </div>
      <div id="timeline-list" class="timeline-list">
        <!-- populated by app.js -->
      </div>
    </section>

  </main>

  <!-- ── Map ──────────────────────────────────────────────────────────────── -->
  <div id="map-container">
    <div id="map-header">
      <span class="panel-title">Global Event Map</span>
      <span class="panel-subtitle">Circle size = severity · Yellow arcs = Romania-impacted events</span>
      <div id="map-controls">
        <button class="map-toggle-btn" id="btn-heat">HEAT</button>
        <button class="map-toggle-btn" id="btn-arcs">RO ARCS</button>
        <button class="map-toggle-btn" id="btn-neighbor-caps">NEIGHBOR CAPS</button>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <!-- App JS -->
  <script src="assets/js/app.js"></script>
</body>
</html>
