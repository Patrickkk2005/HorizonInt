<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HorizonInt — Paused</title>
<style>
  :root {
    --bg: #0b0e11;
    --card: #12161a;
    --border: #232830;
    --text: #e6e9ec;
    --muted: #8a919a;
    --accent: #4f8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 14px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 28px;
  }
  .links {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  a {
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 8px;
    transition: border-color 0.15s ease;
  }
  a:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Paused</span>
    <h1>HorizonInt is taking a break</h1>
    <p>
      This project is on hold for now — the pipeline isn't running,
      so nothing here is live. It might come back, it might not.
      Thanks for stopping by.
    </p>
    <div class="links">
      <a href="https://github.com/Patrickkk2005" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/patrick-neagu-941996379/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </div>
</body>
</html>
