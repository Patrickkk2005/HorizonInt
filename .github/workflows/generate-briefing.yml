name: Generate Daily Briefing

on:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch:   # Allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore articles from gh-pages
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          mkdir -p public/data
          git show "origin/gh-pages:data/articles.json" > public/data/articles.json 2>/dev/null \
            && echo "Restored articles.json" \
            || echo "No articles.json on gh-pages — run fetch-news first"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate AI briefing
        run: python scripts/generate_briefing.py
        env:
          OUTPUT_DIR: public/data
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL:   ${{ secrets.ANTHROPIC_MODEL }}
          OPENAI_MODEL:      ${{ secrets.OPENAI_MODEL }}

      - name: Restore remaining data from gh-pages (for deploy)
        run: |
          for f in articles.json events.json events.geojson stats.json; do
            git show "origin/gh-pages:data/$f" > "public/data/$f" 2>/dev/null || true
          done

      - name: Deploy updated briefing to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'data: daily briefing update [${{ github.run_number }}]'
          user_name: 'HorizonInt Bot'
          user_email: 'github-actions[bot]@users.noreply.github.com'
