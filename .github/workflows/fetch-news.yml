name: Fetch News (Hourly)

on:
  schedule:
    # Every hour at minute 5
    - cron: '5 * * * *'
  workflow_dispatch:   # Allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore existing data from gh-pages
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          mkdir -p public/data
          for f in articles.json events.json events.geojson stats.json; do
            git show "origin/gh-pages:data/$f" > "public/data/$f" 2>/dev/null \
              && echo "Restored $f from gh-pages" \
              || echo "No existing $f, starting fresh"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch RSS feeds & classify Romania impact
        run: python scripts/fetch_feeds.py
        env:
          OUTPUT_DIR: public/data
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_MODEL:   ${{ secrets.ANTHROPIC_MODEL }}
          OPENAI_MODEL:      ${{ secrets.OPENAI_MODEL }}

      - name: Fetch GDELT conflict events
        run: python scripts/fetch_gdelt.py
        env:
          OUTPUT_DIR: public/data

      - name: Fetch GDACS disaster events
        run: python scripts/fetch_gdacs.py
        env:
          OUTPUT_DIR: public/data

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
          commit_message: 'data: hourly feed update [${{ github.run_number }}]'
          user_name: 'HorizonInt Bot'
          user_email: 'github-actions[bot]@users.noreply.github.com'
